FRA_DIR="/opt/oracle/fast_recovery_area"
TOTAL_MEMORY_MB=2048
FRA_SIZE_MB=10240
CHARACTER_SET="AL32UTF8"
NATIONAL_CHARACTER_SET="AL16UTF16"
